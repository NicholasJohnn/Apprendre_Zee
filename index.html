function vPlan(){
  const P = computePlan(); const show = planAll ? P.weeks : P.weeks.slice(0,8);
  const heavy = P.per > P.perWeek;
  return `<div class="lvhead"><div><div class="eyebrow">Programme d'études · week by week</div><h2>Programme</h2><p>A rolling plan from this week to your exam. It reshuffles as you finish lessons, so it always shows what's left.</p></div></div>
   <div class="panel plan-ctl"><div class="row" style="gap:18px">
     <label class="muted">Exam date <input type="date" data-exam value="${esc(S.examDate)}"></label>

function newConjQuiz(c){

  const items = shuffled(pool).slice(0,8).map(([k,i]) => { const full = c.t[k][i];

let DICT = null;
function dictIndex(){
  if (DICT) return DICT; DICT = [];
  const add = (fr, en, src) => { if (fr && en) DICT.push({fr, en, src, k:normWord(fr), ke:normWord(en)}); };
  Object.values(VOCAB).forEach(arr => arr.forEach(w => add(w[0], w[2], "Vocabulaire")));
  THEMES.forEach(t => t.cards.forEach(w => add(w[0], w[2], t.name)));
  PHRASES.forEach(p => add(p[0], p[1], "Expression"));
  Object.values(LEVELS).forEach(L => L.reading.forEach(r => r.gloss.forEach(([f,e]) => add(f, e, "Lecture"))));
  VERB_LIST.forEach(([f,e]) => add(f, e, "Verbe"));
  return DICT;
}
const normWord = s => strip(String(s).toLowerCase().replace(/[’]/g,"'").replace(/\([^)]*\)/g,"").replace(/^(le |la |les |l'|un |une |des |du |de la |de l'|se |s'|to )/,"").replace(/[.,!?;:«»"]/g,"").trim());
function lookupLocal(q, dir){
  const k = normWord(q); if (!k) return [];
  const all = dictIndex().concat(S.myCards.map(c=>({fr:c.fr, en:c.en, src:"My cards", k:normWord(c.fr), ke:normWord(c.en)})));
  const key = dir==="en" ? "ke" : "k";
  const exact = all.filter(d => d[key]===k || d[key].split(/\s*[\/,]\s*/).includes(k));
  const near = k.length>2 ? all.filter(d => !exact.includes(d) && new RegExp("(^|[\\s'/-])"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[\\s/,-])").test(d[key])) : [];
  const seen = new Set(); return [...exact, ...near].filter(d => { const s=d.fr+"|"+d.en; if (seen.has(s)) return false; seen.add(s); return true; }).slice(0,6);
}
let tr = {open:false, q:"", ctx:"", dir:"fr", result:null, busy:false, err:""}, trCtl = null;
function openTranslate(q, ctx){ tr = {open:true, q:(q||"").trim().slice(0,200), ctx:(ctx||"").slice(0,400), dir: guessDir(q), result:null, busy:false, err:""}; renderTr(); if (tr.q) runTranslate(); else setTimeout(()=>document.getElementById("tr-q")?.focus(), 30); }
function guessDir(q){ if (!q) return "fr"; if (/[éèêàâçùûôîœ]/i.test(q)) return "fr"; const fr = lookupLocal(q,"fr").length, en = lookupLocal(q,"en").length; return en>fr ? "en" : "fr"; }

async function runTranslate(){

Reply with only JSON: {"translation":"the best translation in context","alternatives":["up to 3 other common meanings"],"base":"dictionary form if the ${dir==="fr"?"French":"English"} word is inflected (infinitive for verbs, masculine singular for adjectives, noun with le/la), else empty","note":"one short note in English on usage, gender or grammar, or empty"}`, {modelTier:"quick", signal:trCtl.signal});

    } else if (!IN_CLAUDE){

  if (d.xplay!=null){ const i=+d.xplay; if(run.played[i]) return; run.played[i]=true; el.disabled=true; el.textContent="Playing…"; say(run.m.co[i].s, 0.95, false, ()=>{ el.textContent="Played"; }); return; }
  if (d.xans){ const [sec,i,j]=d.xans.split(":"); run.ans[sec][+i]=+j; el.parentElement.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed", b===el)); return; }
  if (d.xnext!=null){ const i=SEC.findIndex(s=>s[0]===run.sec); try{ speechSynthesis.cancel(); }catch(e){} if (run.sec==="eo"){ finishMock(); return; } run.sec=SEC[i+1][0]; run.deadline=Date.now()+SEC[i+1][3]*60000; render(); window.scrollTo({top:0}); return; }
  if (d.xquit!=null){ if (el.dataset.sure){ run=null; try{ speechSynthesis.cancel(); }catch(e){} render(); } else { el.dataset.sure="1"; el.textContent="Quit? Answers are lost"; el.classList.add("danger"); } return; }
  if (d.xback!=null){ run=null; render(); window.scrollTo({top:0}); return; }
  if (d.diagsave!=null){ saveDiag(); return; }
  if (d.planall!=null){ planAll=!planAll; render(); return; }
  if (d.verb){ conjVerb=d.verb; conjSearch=""; conjQuiz=null; render(); return; }
  if (d.conjgo){ conjVerb=d.conjgo; conjSearch=""; conjQuiz=null; closeTranslate(); go("conjugaison"); return; }
  if (d.conjcover!=null){ conjCover=!conjCover; render(); return; }
  if (d.conjquizgo!=null){ newConjQuiz(conjugate(conjVerb)); render(); document.querySelector(".conjquiz")?.scrollIntoView({block:"start"}); return; }
  if (d.conjquizclose!=null){ conjQuiz=null; render(); return; }
  if (d.trclose!=null){ closeTranslate(); return; }
  if (d.trdir!=null){ tr.dir = tr.dir==="fr"?"en":"fr"; tr.q=document.getElementById("tr-q").value.trim(); tr.result=null; renderTr(); if (tr.q) runTranslate(); return; }
  if (d.tropen!=null){ openTranslate(window.getSelection().toString().trim().slice(0,200), ""); return; }
  if (d.profile){ if (d.profile!==activeProfile) switchProfile(d.profile); return; }
  if (d.profren){ renamingProfile=d.profren; render(); const i=document.getElementById("rp-name"); if(i){ i.focus(); i.select(); } return; }
  if (d.profdel){ if (d.profdel==="no"){ confirmProfileDel=null; }
    else if (d.profdel==="yes"){ const id=confirmProfileDel; confirmProfileDel=null; try{ localStorage.removeItem(KEY+":"+id); }catch(e){} profiles=profiles.filter(p=>p.id!==id); saveProfiles(); if (activeProfile===id){ switchProfile("default"); return; } toast("Profile deleted"); }
    else confirmProfileDel=d.profdel; render(); return; }
  if (d.auth==="up"){ doAuth("up"); return; }
  if (d.signout!=null){ signOut(); return; }
  if (d.import!=null){ const raw=lsGet(activeProfile==="default"?KEY:KEY+":"+activeProfile); if(raw){ try{ S=Object.assign(defaults(), JSON.parse(raw)); }catch(e){} } offerImport=false; save(); render(); toast("Progress copied into your account"); return; }
  if (d.noimport!=null){ offerImport=false; render(); return; }
  if (d.copy!=null){ const ta=document.getElementById("bk-out"); const p=navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject(); p.then(()=>toast("Backup copied")).catch(()=>{ ta.focus(); ta.select(); toast("Selected. Press Ctrl+C to copy"); }); return; }
  if (d.restore){ const rc=document.getElementById("restore-confirm");
    if (d.restore==="ask"){ rc.innerHTML=`<span class="inline-confirm">This replaces your current data. <button class="btn small danger" data-restore="yes">Restore</button></span>`; return; }
    try{ const o=JSON.parse(document.getElementById("bk-in").value); Object.keys(defaults()).forEach(k=>{ if(o[k]!=null && k!=="updatedAt") S[k]=o[k]; }); save(); showBackup=false; noteSel=null; toast("Backup restored"); render(); }catch(err){ rc.textContent="That text isn't a valid backup. Paste the whole backup and try again."; } return; }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  const f=e.target;
  if (f.matches("[data-typein]")){ const qEl=f.closest(".q"); if(qEl.dataset.answered!=null) return; const {q}=findQ(qEl.dataset.q); const v=f.querySelector("input").value; if(!v.trim()) return;
    const ok = q.t.some(a=>norm(a)===norm(v)); const close = !ok && q.t.some(a=>strip(norm(a))===strip(norm(v)));
    f.querySelector("input").disabled=true; f.querySelector("button").disabled=true;
    answerQ(qEl, ok||close, ok?"Correct ! "+esc(q.x||""):close?`Almost! Check the accents: <b>${esc(q.t[0])}</b>`:`Answer: <b>${esc(q.t[0])}</b>. ${esc(q.x||"")}`, close?"almost":undefined); return; }
  if (f.matches("[data-diagform]")){ submitDiag(); return; }
  if (f.matches("[data-authform]")){ doAuth("in"); return; }
  if (f.matches("[data-conjquiz]")){ if (!conjQuiz.checked) checkConjQuiz(); return; }
  if (f.matches("[data-trform]")){ tr.q=document.getElementById("tr-q").value.trim(); tr.ctx=""; if (tr.q){ tr.dir = /[éèêàâçùûôîœ]/i.test(tr.q) ? "fr" : tr.dir; runTranslate(); } return; }
  if (f.matches("[data-newprofile]")){ const n=document.getElementById("np-name").value.trim(); if(!n) return; const p={id:"p"+Date.now(), name:n}; profiles.push(p); saveProfiles(); switchProfile(p.id); return; }
  if (f.matches("[data-renprofile]")){ const n=document.getElementById("rp-name").value.trim(); const p=profiles.find(x=>x.id===f.dataset.renprofile); if(p&&n){ p.name=n; saveProfiles(); } renamingProfile=null; render(); return; }
  if (f.matches("[data-newcard]")){ const fr=document.getElementById("nc-fr").value.trim(), en=document.getElementById("nc-en").value.trim(), ex=document.getElementById("nc-ex").value.trim(); if(!fr||!en) return;
    S.myCards.push({id:"m"+Date.now(), fr, en, ex}); save(); toast("Card added"); deck="mine"; queue=[]; curCard=null; render(); return; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if (t.dataset.plan){ S.plan[TODAY]=S.plan[TODAY]||{}; S.plan[TODAY][t.dataset.plan]=t.checked; if(t.checked) markActive(); save(); render(); }
  if (t.dataset.curlv!=null){ S.current=t.value; save(); render(); }
  if (t.dataset.exam!=null){ S.examDate=t.value; save(); render(); }
  if (t.dataset.perweek!=null){ S.perWeek=+t.value; save(); render(); }
  if (t.dataset.week){ S.weeksDone[t.dataset.week]=t.checked; if(t.checked) markActive(); save(); }
  if (t.dataset.selfrate && run && run.rec){ const k=t.dataset.selfrate; run.rec[k] = t.value ? +t.value : null; save(); const el=document.getElementById("res-"+k); if(el) el.innerHTML=resCell(k, run.rec[k]); }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if (t.id==="conj-q"){ conjSearch=t.value; const pos=t.selectionStart; render(); const n=document.getElementById("conj-q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if (t.dataset.speak){ S.speak[t.dataset.speak]=t.value; save(); const w=document.getElementById("wcs-"+t.dataset.speak); if(w) w.textContent=wc(t.value)+" words"; }
  if (t.dataset.xee!=null && run){ run.ee=t.value; document.getElementById("wc-xee").textContent=wc(t.value)+" words"; }
  if (t.dataset.xeo!=null && run){ run.eo=t.value; document.getElementById("wc-xeo").textContent=wc(t.value)+" words"; }
  if (t.dataset.draft){ S.drafts[t.dataset.draft]=t.value; save(); const n=wc(t.value); const w=document.getElementById("wc-"+t.dataset.draft); w.textContent=`${n} / ${t.dataset.min}–${t.dataset.max} mots`; w.classList.toggle("ok", n>=+t.dataset.min); if(n%20===0&&n) markActive(); }
});
document.addEventListener("keydown", e=>{
  if (view!=="cartes" || !curCard) return;
  if (e.target.matches("input, textarea")) return;
  if (e.key===" " || e.key==="Enter"){ if(e.target.closest("button:not([data-flip])")) return; e.preventDefault(); flipped=!flipped; drawCard(); }
  else if (flipped && ["1","2","3"].includes(e.key)) grade(+e.key-1);
});
document.addEventListener("click", e=>{ if(e.target.closest("[data-flip]") && !e.target.closest("button")){ flipped=!flipped; drawCard(); } });
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.matches(".dict input")){ checkDict(e.target.closest("[data-dict]").dataset.dict); } });
document.addEventListener("keydown", e=>{ if (e.key==="Enter" && e.target.id==="conj-q"){ const first=document.querySelector(".conj-search .chip"); if (first && conjSearch.trim()){ e.preventDefault(); first.click(); } } });
document.addEventListener("click", e=>{ const f=e.target.closest(".covered .cform"); if (f) f.classList.toggle("shown"); });

function checkDict(key){
  const [lv,i]=key.split("-"); const [fr,en]=(lv==="qc"?QC_DICTEE:LEVELS[lv].listening.dictee)[+i];
  const item=document.querySelector(`[data-dict="${key}"]`); const v=item.querySelector("input").value;
  const target = fr.split(/\s+/); const got = norm(v).split(" ");
  const html = target.map((w,k)=>{ const ok = norm(w)===(got[k]||""); return `<span class="${ok?"w-ok":"w-no"}">${esc(w)}</span>`; }).join(" ");
  const res=item.querySelector(".res"); res.hidden=false;
  const perfect = norm(v)===norm(fr);
  res.innerHTML = (perfect?"<b>Parfait !</b> ":"") + html + `<div class="muted" style="font-family:var(--font-body);font-size:.85rem">${esc(en)}</div>`;
  markActive();
}
function stopTimer(k){ if(timers[k]){ clearInterval(timers[k].iv); delete timers[k]; } }
function startTimer(k, total, btn){
  const el=document.getElementById("t-"+k);
  if (timers[k]){ stopTimer(k); btn.textContent="Resume"; return; }
  let left = timers["left-"+k]!=null ? timers["left-"+k] : total; if(left<=0) left=total;
  btn.textContent="Pause"; el.classList.remove("done"); markActive();
  timers[k]={iv:setInterval(()=>{ left--; timers["left-"+k]=left; el.textContent=fmt(Math.max(0,left)); if(left<=0){ stopTimer(k); el.classList.add("done"); el.textContent="Temps !"; btn.textContent="Start"; delete timers["left-"+k]; } },1000)};
}

window.addEventListener("hashchange", ()=>{ const h=location.hash.replace("#",""); if(VIEWS.some(v=>v[0]===h) && h!==view){ view=h; render(); } });
render();
initAI();
initCloud();
initAccounts();
