<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet de Français</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a French school notebook (cahier Seyès). Ink-blue headings, red margin rule, lavender ruling behind notes and flashcards. */
:root{
  --paper:#f6f7fc; --surface:#ffffff; --surface-2:#eef0fa;
  --ink:#18244f; --ink-soft:#56608a; --rule:#d3d8f0; --rule-strong:#b6bee6;
  --accent:#2343c4; --accent-ink:#ffffff; --margin:#d33d57;
  --ok:#1d7a4b; --ok-bg:#e3f4ea; --bad:#b4243c; --bad-bg:#fbe5e9; --hl:#fff1a1;
  --a1:#2a8f6a; --a2:#2f78c4; --b1:#8a4fc4; --b2:#c2493a;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --font-hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --font-mono:"IBM Plex Mono", Consolas, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10142a; --surface:#181e39; --surface-2:#20284a;
  --ink:#e7eafa; --ink-soft:#a5add2; --rule:#2a3258; --rule-strong:#3a4474;
  --accent:#93a8ff; --accent-ink:#0f1430; --margin:#ff7b90;
  --ok:#62d69c; --ok-bg:#163828; --bad:#ff8399; --bad-bg:#3d1a24; --hl:#544a12;
  --a1:#5fd0a6; --a2:#74aef0; --b1:#be93f2; --b2:#f08a7a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10142a; --surface:#181e39; --surface-2:#20284a;
  --ink:#e7eafa; --ink-soft:#a5add2; --rule:#2a3258; --rule-strong:#3a4474;
  --accent:#93a8ff; --accent-ink:#0f1430; --margin:#ff7b90;
  --ok:#62d69c; --ok-bg:#163828; --bad:#ff8399; --bad-bg:#3d1a24; --hl:#544a12;
  --a1:#5fd0a6; --a2:#74aef0; --b1:#be93f2; --b2:#f08a7a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;line-height:1.15;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--margin)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--margin)}
.brand small{font-family:var(--font-hand);font-size:1.25rem;color:var(--ink-soft)}
.streak{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-soft);display:flex;gap:12px}
.streak b{color:var(--ink)}
nav.main{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;max-width:100%}
nav.main button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
nav.main button:hover{background:var(--surface-2);color:var(--ink)}
nav.main button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.lvdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.lvchip{font-family:var(--font-mono);font-size:.75rem;padding:2px 7px;border-radius:5px;color:#fff;font-weight:500;letter-spacing:.04em}
.c-a1{background:var(--a1)}.c-a2{background:var(--a2)}.c-b1{background:var(--b1)}.c-b2{background:var(--b2)}
:root[data-theme="dark"] .lvchip{color:#10142a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .lvchip{color:#10142a} }

main{padding-block:24px 64px}
.eyebrow{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.btn{border:1.5px solid var(--rule-strong);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.88rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.say{border:0;background:var(--surface-2);border-radius:50%;width:30px;height:30px;cursor:pointer;display:inline-grid;place-items:center;flex:none;vertical-align:middle;color:var(--accent)}
.say:hover{background:var(--accent);color:var(--accent-ink)}
.say svg{width:16px;height:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:20px}

/* level header + subtabs */
.lvhead{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.lvhead h2{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em}
.lvhead p{margin:6px 0 0;max-width:60ch;color:var(--ink-soft)}
.meter{width:220px;max-width:100%}
.meter .bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--lv,var(--accent));border-radius:4px}
.meter span{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-soft)}
.subtabs{display:flex;gap:0;border-bottom:1.5px solid var(--rule-strong);margin-bottom:22px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:10px 16px;cursor:pointer;font-weight:700;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;text-align:left;line-height:1.2}
.subtabs button small{display:block;font-weight:400;font-size:.75rem}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lv,var(--accent))}

/* grammar */
.gram{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
.lesson-list{display:flex;flex-direction:column;gap:2px;position:sticky;top:90px}
.lesson-list button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.lesson-list button:hover{background:var(--surface-2)}
.lesson-list button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--lv)}
.lesson-list .num{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-soft);padding-top:3px;min-width:18px}
.lesson-list .t{flex:1;min-width:0}
.lesson-list .t small{display:block;color:var(--ink-soft);font-size:.8rem}
.tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule-strong);flex:none;margin-top:2px;display:grid;place-items:center}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tick svg{width:11px;height:11px}
article.lesson{min-width:0}
article.lesson h3{font-size:1.9rem;font-weight:700;margin-bottom:4px}
article.lesson .en{color:var(--ink-soft);font-style:italic;margin:0 0 14px}
.intro{font-size:1.06rem;max-width:68ch}
.block{margin:20px 0}
.block h4{font-size:1.05rem;margin-bottom:8px}
.block ul{margin:0;padding-left:20px;max-width:70ch}
.block li{margin:5px 0}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.fr{font-family:var(--font-read);font-weight:600}
.examples{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.ex .txt{min-width:0}
.ex .txt div:first-child{font-family:var(--font-read);font-size:1.05rem}
.ex .txt div:last-child{color:var(--ink-soft);font-size:.88rem}
.trap{border-left:4px solid var(--margin);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;max-width:70ch}
.trap b:first-child{color:var(--margin);font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}

/* quiz */
.quiz{margin-top:28px;border-top:2px dashed var(--rule-strong);padding-top:20px}
.q{padding:14px 0;border-bottom:1px solid var(--rule)}
.q p{margin:0 0 8px;font-family:var(--font-read);font-size:1.05rem}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--rule-strong);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-family:var(--font-read)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.typein{display:flex;gap:8px;flex-wrap:wrap}
.typein input{flex:1;min-width:0;max-width:420px;padding:8px 12px;border:1.5px solid var(--rule-strong);border-radius:8px;background:var(--surface);font-family:var(--font-read)}
.fb{margin-top:8px;font-size:.92rem;padding:8px 12px;border-radius:8px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.almost{background:var(--hl)}
.score{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.accent-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.accent-bar button{border:1px solid var(--rule-strong);background:var(--surface-2);border-radius:5px;padding:1px 8px;cursor:pointer;font-family:var(--font-read)}

/* cards grid */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.chan{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);text-decoration:none;color:var(--ink)}
.chan:hover{border-color:var(--accent)}
.chan h4{font-size:1.05rem}
.chan p{margin:0;font-size:.92rem;color:var(--ink-soft)}
.chan .go{margin-top:auto;font-weight:700;color:var(--accent);font-size:.9rem}
.tag{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.section-title:first-child{margin-top:0}
.section-title h3{font-size:1.4rem}
.tips{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tip{padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius)}
.tip h4{font-size:1rem;margin-bottom:4px}
.tip p{margin:0;font-size:.94rem}

/* dictée */
.dict{display:flex;flex-direction:column;gap:10px}
.dict .item{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.dict .item input{width:100%;padding:8px 10px;border:1.5px solid var(--rule-strong);border-radius:8px;background:var(--paper);font-family:var(--font-read)}
.dict .res{grid-column:1/-1;font-family:var(--font-read)}
.dict .res .w-ok{color:var(--ok)}.dict .res .w-no{color:var(--bad);text-decoration:underline wavy}
.slow{font-family:var(--font-mono);font-size:.72rem;border:1px solid var(--rule-strong);border-radius:6px;background:none;padding:4px 6px;cursor:pointer;color:var(--ink-soft)}

/* reading */
.reading{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.passage{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:24px 26px;font-family:var(--font-read);font-size:1.12rem;line-height:1.75}
.passage h3{font-family:var(--font-read);font-size:1.5rem;font-weight:600;margin-bottom:4px}
.passage .src{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.passage p{margin:0 0 14px}
.gloss{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.gloss div{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;border-bottom:1px dotted var(--rule-strong);padding:3px 0}
.gloss div span:first-child{font-family:var(--font-read);font-weight:600}
.picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.picker button{border:1.5px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:700}
.picker button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* speaking */
.frames{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.frame{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px}
.frame h4{font-size:.98rem;margin-bottom:8px}
.frame ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.frame li{display:flex;gap:8px;align-items:center;font-family:var(--font-read)}
.prompt{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.prompt .task{font-family:var(--font-read);font-size:1.15rem;margin:4px 0 10px}
.timer{font-family:var(--font-mono);font-size:1.6rem;min-width:84px;font-variant-numeric:tabular-nums}
.timer.done{color:var(--margin)}
details.model{margin-top:10px}
details.model summary{cursor:pointer;font-weight:700;color:var(--accent)}
.ladder{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ladder div{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:start;font-family:var(--font-read)}

/* writing */
.draft textarea{width:100%;min-height:200px;padding:14px 16px 14px 56px;border:1px solid var(--rule-strong);border-radius:var(--radius);font-family:var(--font-read);font-size:1.05rem;line-height:32px;background-color:var(--surface);background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px,var(--margin) 41.5px,transparent 41.5px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule-strong) 31px 32px);background-attachment:local;resize:vertical}
.wc{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-soft)}
.wc.ok{color:var(--ok)}

/* today */
.today{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.wod{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:24px 26px 22px 64px;background-image:linear-gradient(90deg,transparent 44px,var(--margin) 44px,var(--margin) 46px,transparent 46px),repeating-linear-gradient(180deg,transparent 0 23px,var(--rule) 23px 24px);}
.wod .eyebrow{margin-bottom:6px}
.wod .word{font-family:var(--font-display);font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.02em;line-height:1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wod .gender{font-family:var(--font-mono);font-size:.85rem;font-weight:500;color:var(--ink-soft)}
.wod .mean{font-size:1.15rem;margin:8px 0}
.wod .exs{font-family:var(--font-hand);font-size:1.6rem;line-height:1.2;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:22px}
.plan li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule)}
.plan ul{margin:0;padding:0}
.plan input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);margin-top:2px;flex:none}
.plan label{flex:1;cursor:pointer}
.plan label small{display:block;color:var(--ink-soft)}
.plan .go{font-size:.85rem;white-space:nowrap}
.progress4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.progress4 button{border:1px solid var(--rule);background:var(--surface);border-radius:var(--radius);padding:12px;text-align:left;cursor:pointer}
.progress4 button:hover{border-color:var(--accent)}
.progress4 .big{font-family:var(--font-display);font-size:1.6rem;font-weight:800}
.progress4 .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress4 .bar i{display:block;height:100%}
.countdown{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.countdown .n{font-family:var(--font-display);font-size:2.4rem;font-weight:800;line-height:1}
.countdown input{padding:6px 10px;border:1.5px solid var(--rule-strong);border-radius:8px;background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.cal i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%}
.cal i.on{background:var(--ok)}
.cal i.now{outline:2px solid var(--accent);outline-offset:1px}

/* flashcards */
.fc-wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.decks{display:flex;flex-direction:column;gap:6px}
.decks button{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.decks button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.decks .due{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-soft)}
.card-stage{perspective:1200px}
.fcard{position:relative;min-height:290px;border-radius:14px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fcard.flipped{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--rule-strong);padding:28px 28px 28px 70px;display:flex;flex-direction:column;justify-content:center;gap:8px;background-color:var(--surface);background-image:linear-gradient(90deg,transparent 48px,var(--margin) 48px,var(--margin) 50px,transparent 50px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px)}
.fcard .back{transform:rotateY(180deg)}
.fcard .big{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.fcard .hand{font-family:var(--font-hand);font-size:1.6rem;color:var(--accent);line-height:1.2}
.fcard .hint{position:absolute;bottom:12px;right:16px;font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft)}
.grade{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.grade .btn{flex:1;justify-content:center;min-width:110px}
.boxes{display:flex;gap:6px;margin-top:8px}
.boxes span{flex:1;text-align:center;font-family:var(--font-mono);font-size:.72rem;padding:6px 0;background:var(--surface-2);border-radius:6px}
.boxes b{display:block;font-size:1rem;color:var(--ink)}
.form{display:grid;gap:10px}
.form input,.form select,.form textarea{width:100%;padding:8px 12px;border:1.5px solid var(--rule-strong);border-radius:8px;background:var(--surface)}
.form label{font-size:.85rem;font-weight:700;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px}

   {q:"Gender of « maison »?", o:["masculin","féminin"], a:1, x:"An exception: la maison."},
   {q:"Plural of « le bureau »:", t:["les bureaux","bureaux"], x:"-eau → -eaux."},
   {q:"Plural of « l'animal »:", t:["les animaux","animaux"], x:"-al → -aux."}]},

 {id:"a1-articles", title:"Les articles", en:"Articles: le, un, du", yt:"French articles partitive du de la Français avec Pierre",
  intro:"French almost never drops the article. Choosing between <b>the</b>, <b>a</b> and <b>some</b> depends on the noun's gender and on what you mean.",
  blocks:[
   {t:"table", h:"Which article when", head:["","Masc.","Fem.","Before vowel","Plural"], rows:[
     ["<b>Définis</b> (the)","le","la","l'","les"],["<b>Indéfinis</b> (a / some)","un","une","un / une","des"],["<b>Partitifs</b> (some, uncountable)","du","de la","de l'","des"]]},
   {t:"rules", h:"The rules that matter", items:[
     "Likes and dislikes use the <b>definite</b> article: <span class=fr>J'aime <mark>le</mark> café.</span> (coffee in general)",
     "An amount of something uses the <b>partitive</b>: <span class=fr>Je bois <mark>du</mark> café.</span> (some coffee)",
     "After a negative, un/une/des/du/de la become <b>de / d'</b>: <span class=fr>Je n'ai pas <mark>de</mark> frère.</span> (not after être)",
     "After quantities, just <b>de</b>: <span class=fr>beaucoup de travail, un peu d'argent</span>.",
     "No article for a job after être: <span class=fr>Il est médecin.</span>",
     "Contractions: <b>à + le = au</b>, <b>à + les = aux</b>, <b>de + le = du</b>, <b>de + les = des</b>."]},
   {t:"ex", items:[["Je mange du pain, mais je n'aime pas le fromage.","I eat bread, but I don't like cheese."],["Il n'y a pas de livres sur la table.","There are no books on the table."]]},
   {t:"trap", text:"English speakers say <span class=fr>« Il est un professeur »</span>. In French: <span class=fr>Il est professeur</span> or <span class=fr>C'est un professeur</span>."}],
  quiz:[
   {q:"J'aime ___ chocolat. (in general)", o:["le","du","un"], a:0, x:"General likes → definite article."},
   {q:"Je mange ___ chocolat. (some)", o:["le","du","de"], a:1, x:"An amount → partitive du."},
   {q:"J'ai un chien → Je n'ai pas ___ chien.", o:["un","de","du"], a:1, x:"After negation → de."},
   {q:"Fix it: « Il est un professeur. »", t:["il est professeur","il est professeur."], x:"No article after être + job."},
   {q:"à + le = ?", t:["au"], x:"Je vais au marché."}]},

 {id:"a1-etre-avoir", title:"Être, avoir et les pronoms", en:"To be, to have & subject pronouns", yt:"être avoir conjugation French beginner",
  intro:"Être (to be) and avoir (to have) are the two most important verbs. They are irregular, so learn them by heart. They also build the past tense later.",
  blocks:[
   {t:"table", h:"Present tense", head:["Pronoun","être","avoir"], rows:[["je / j'","suis","ai"],["tu","es","as"],["il / elle / on","est","a"],["nous","sommes","avons"],["vous","êtes","avez"],["ils / elles","sont","ont"]]},
   {t:"rules", h:"Pronoun tips", items:[
     "<b>on</b> = « we » in everyday speech: <span class=fr>On va au cinéma ?</span>",
     "<b>tu</b> for friends and family, <b>vous</b> for strangers, formal situations and plural. In the exam, use <b>vous</b> with the examiner.",
     "<b>ils</b> for a group with at least one man, even with ten women."]},
   {t:"rules", h:"Avoir where English uses « to be »", items:["<span class=fr>J'ai 28 ans</span> — I am 28","<span class=fr>J'ai faim / soif / froid / chaud / peur</span> — I'm hungry / thirsty / cold / hot / scared","<span class=fr>Il a raison / tort</span> — he is right / wrong"]},
   {t:"trap", text:"Never <span class=fr>« Je suis 28 »</span> or <span class=fr>« Je suis faim »</span>. Age and hunger use <b>avoir</b>."}],
  quiz:[
   {q:"Nous ___ contents.", o:["sommes","avons","êtes"], a:0, x:"nous sommes."},
   {q:"Elle ___ 30 ans.", o:["est","a","as"], a:1, x:"Age uses avoir."},
   {q:"« I'm hungry » =", o:["Je suis faim","J'ai faim","Je fais faim"], a:1, x:"avoir faim."},
   {q:"Five women and one man = ?", o:["elles","ils"], a:1, x:"One man → ils."},
   {q:"Vous ___ (être) très gentil.", t:["êtes"], x:"vous êtes."}]},

 {id:"a1-er", title:"Les verbes en -ER", en:"Regular -ER verbs (present)", yt:"French ER verbs present tense",
  intro:"About 90% of French verbs end in -er and follow one pattern. Take the stem (parl-) and add the endings.",
  blocks:[
   {t:"table", h:"parler — to speak", head:["Pronoun","Form","Sounds like"], rows:[["je","parl<b>e</b>","« parl »"],["tu","parl<b>es</b>","« parl »"],["il / elle / on","parl<b>e</b>","« parl »"],["nous","parl<b>ons</b>","« parlon »"],["vous","parl<b>ez</b>","« parlé »"],["ils / elles","parl<b>ent</b>","« parl »"]]},
   {t:"rules", h:"Spelling changes to watch", items:["manger → <span class=fr>nous mang<mark>e</mark>ons</span>","commencer → <span class=fr>nous commen<mark>ç</mark>ons</span>","acheter → <span class=fr>j'ach<mark>è</mark>te</span>","appeler → <span class=fr>je m'appe<mark>ll</mark>e</span>"]},
   {t:"ex", items:[["J'habite à Vancouver et je travaille dans un magasin.","I live in Vancouver and I work in a store."],["Nous regardons un film ce soir.","We are watching a film tonight."]]},
   {t:"trap", text:"The -ent of <span class=fr>ils parlent</span> is <b>silent</b>. Saying « parl-ENT » is a classic beginner mistake."}],
  quiz:[

   {q:"Nous ___ (manger) à midi.", t:["mangeons"], x:"Keep the e: mangeons."},
   {q:"Tu ___ (travailler) demain ?", t:["travailles"], x:"tu travailles."},
   {q:"Which forms all sound the same?", o:["parle, parles, parlent","parlons, parlez","parle, parlez"], a:0, x:"Only nous and vous sound different."}]},

 {id:"a1-adj", title:"Les adjectifs", en:"Adjectives: agreement & position", yt:"French adjective agreement BAGS position",
  intro:"Adjectives agree in gender and number with their noun, and most go <b>after</b> it, the opposite of English.",
  blocks:[
   {t:"table", h:"Agreement", head:["Rule","Masc.","Fem.","Plural"], rows:[["add -e","grand","grande","grands / grandes"],["already ends in -e","jeune","jeune","jeunes"],["-eux → -euse","heureux","heureuse","heureux / heureuses"],["-if → -ive","actif","active","actifs / actives"],["double consonant","bon","bonne","bons / bonnes"],["-er → -ère","premier","première","premiers / premières"]]},
   {t:"rules", h:"Position: BAGS go before", items:["Most adjectives go after: <span class=fr>une voiture rouge</span>.","<b>B</b>eauty, <b>A</b>ge, <b>G</b>oodness, <b>S</b>ize go before: <span class=fr>beau, joli, jeune, vieux, nouveau, bon, mauvais, grand, petit</span>.","Before a vowel: <span class=fr>un <mark>bel</mark> homme, un <mark>nouvel</mark> ami, un <mark>vieil</mark> arbre</span>."]},
   {t:"ex", items:[["une belle maison moderne","a beautiful modern house"],["un petit chien noir","a small black dog"]]},
   {t:"trap", text:"Some adjectives change meaning with position: <span class=fr>mon ancien professeur</span> (my former teacher) vs <span class=fr>une ville ancienne</span> (an old city)."}],
  quiz:[
   {q:"une maison ___ (grand)", t:["grande"], x:"Feminine → grande."},
   {q:"un homme ___ (beau) → un ___ homme", o:["beau","bel","belle"], a:1, x:"Before a vowel: bel."},
   {q:"des femmes ___ (heureux)", t:["heureuses"], x:"-eux → -euses."},
   {q:"Put in order: nouvelle / voiture / une", o:["une voiture nouvelle","une nouvelle voiture"], a:1, x:"BAGS: nouveau goes before."}]},

 {id:"a1-neg-q", title:"La négation et les questions", en:"Negatives & questions", yt:"French negation questions est-ce que inversion",
  intro:"Negation wraps around the verb. Questions can be asked three ways, from casual to formal.",
  blocks:[
   {t:"table", h:"Negatives", head:["French","English","Example"], rows:[["ne … pas","not","Je ne travaille pas."],["ne … jamais","never","Il ne mange jamais de viande."],["ne … plus","no longer","Elle n'habite plus ici."],["ne … rien","nothing","Je ne vois rien."],["ne … personne","nobody","Je ne connais personne."]]},
   {t:"table", h:"Three ways to ask", head:["Style","Example"], rows:[["Intonation (casual)","Tu parles anglais ?"],["Est-ce que (neutral)","Est-ce que tu parles anglais ?"],["Inversion (formal)","Parlez-vous anglais ? · Parle-t-il anglais ?"]]},
   {t:"rules", h:"Question words", items:["<span class=fr>où</span> where · <span class=fr>quand</span> when · <span class=fr>comment</span> how · <span class=fr>pourquoi</span> why · <span class=fr>combien</span> how much","<span class=fr>qui</span> who · <span class=fr>que / quoi</span> what · <span class=fr>quel, quelle, quels, quelles</span> which (agrees with the noun)"]},
   {t:"trap", text:"In spoken French the « ne » often disappears: <span class=fr>Je sais pas</span>. Fine when speaking casually, but always write it."}],
  quiz:[

   {q:"« I never eat meat »", o:["Je ne mange jamais de viande","Je ne mange pas jamais viande","Je mange jamais la viande"], a:0, x:"ne … jamais + de."},
   {q:"Formal version of « Vous parlez anglais ? »", o:["Parlez-vous anglais ?","Vous-parlez anglais ?","Est-vous parlez anglais ?"], a:0, x:"Inversion with a hyphen."},
   {q:"___ heure est-il ?", o:["Quel","Quelle","Quels"], a:1, x:"heure is feminine → quelle."}]},

 {id:"a1-lieux", title:"Villes et pays : à, en, au", en:"Cities and countries", yt:"French prepositions countries cities à en au",

 {id:"a1-poss", title:"Possessifs et démonstratifs", en:"my, your, this, that", yt:"French possessive adjectives mon ma mes",

   {q:"Il ___ né en 1990.", o:["a","est"], a:1, x:"naître takes être."}]},

 {id:"a2-imparfait", title:"L'imparfait", en:"The imperfect (was …ing / used to)", yt:"imparfait French explained",
  intro:"The imparfait describes the background: what things were like, what was happening, what used to happen.",
  blocks:[
   {t:"rules", h:"How to form it", items:["Take the <b>nous</b> form of the present, remove -ons: <span class=fr>nous parl<s>ons</s> → parl-</span>, <span class=fr>nous finiss<s>ons</s> → finiss-</span>.","Add: <b>-ais, -ais, -ait, -ions, -iez, -aient</b>.","Only exception: être → <span class=fr>ét-</span> (j'étais)."]},
   {t:"table", h:"When to use it", head:["Use","Example"], rows:[["Description","Il faisait beau. La maison était grande."],["Habit","Quand j'étais petite, je jouais dehors."],["Ongoing action","Je lisais quand tu as appelé."],["Feelings / states","J'avais peur."]]},
   {t:"rules", h:"Signal words", items:["<span class=fr>d'habitude, tous les jours, souvent, autrefois, quand j'étais enfant, à l'époque</span>"]},
   {t:"trap", text:"-ais, -ait and -aient all sound the same (« è »). Context and the subject tell you who."}],
  quiz:[
   {q:"nous finissons → je ___", t:["finissais"], x:"finiss- + ais."},
   {q:"être → j'___", t:["étais"], x:"The one irregular stem."},
   {q:"Il ___ (faire) beau.", t:["faisait"], x:"Description → imparfait."},
   {q:"Which signals the imparfait?", o:["soudain","d'habitude","hier à 15 h"], a:1, x:"A habit."}]},

 {id:"a2-futur", title:"Futur proche et futur simple", en:"Talking about the future", yt:"futur proche futur simple French",
  intro:"<b>Futur proche</b> (aller + infinitive) for near, planned things. <b>Futur simple</b> for longer-term plans, predictions and promises.",
  blocks:[
   {t:"ex", items:[["Je vais appeler ma mère ce soir.","I'm going to call my mother tonight."],["Dans cinq ans, je parlerai couramment français.","In five years, I'll speak French fluently."]]},
   {t:"rules", h:"Futur simple", items:["Infinitive + <b>-ai, -as, -a, -ons, -ez, -ont</b>: <span class=fr>je parlerai, tu finiras</span>.","-re verbs drop the e: <span class=fr>prendre → je prendrai</span>."]},
   {t:"table", h:"Irregular stems", head:["Verb","Stem","Verb","Stem"], rows:[["être","ser-","avoir","aur-"],["aller","ir-","faire","fer-"],["venir","viendr-","pouvoir","pourr-"],["vouloir","voudr-","devoir","devr-"],["savoir","saur-","voir","verr-"]]},
   {t:"trap", text:"After <b>quand</b> about the future, French uses the future (English uses present): <span class=fr>Quand j'<mark>arriverai</mark>, je t'appellerai.</span>"}],
  quiz:[
   {q:"Je ___ partir. (futur proche)", o:["vais","irai","va"], a:0, x:"aller + infinitive."},
   {q:"Nous ___ (être) prêts.", t:["serons"], x:"ser- + ons."},
   {q:"Ils ___ (faire) les courses.", t:["feront"], x:"fer- + ont."},
   {q:"« When I arrive, I'll call »", o:["Quand j'arrive, j'appellerai","Quand j'arriverai, j'appellerai"], a:1, x:"Future after quand."}]},

 {id:"a2-cod-coi", title:"Pronoms COD et COI", en:"Object pronouns: le, la, lui, leur", yt:"French direct indirect object pronouns le la lui leur",
  intro:"Replacing nouns with pronouns makes you sound natural. Repeating the full noun every time is the clearest sign of a beginner.",
  blocks:[
   {t:"table", h:"The pronouns", head:["","Direct (no preposition)","Indirect (à + person)"], rows:[["me","me / m'","me / m'"],["you","te / t'","te / t'"],["him / her / it","le / la / l'","lui"],["us","nous","nous"],["you","vous","vous"],["them","les","leur"]]},
   {t:"rules", h:"Placement", items:["Before the conjugated verb: <span class=fr>Je <mark>la</mark> vois.</span>","Before the auxiliary in the past: <span class=fr>Je <mark>l'</mark>ai vue.</span>","Before the infinitive: <span class=fr>Je vais <mark>lui</mark> parler.</span>"]},
   {t:"rules", h:"Verbs that differ from English", items:["Indirect in French: <span class=fr>téléphoner à, parler à, répondre à, demander à, donner à</span> → <span class=fr>Je lui téléphone.</span>","Direct in French: <span class=fr>regarder, écouter, attendre, chercher</span> → <span class=fr>Je l'attends.</span>"]},
   {t:"trap", text:"<span class=fr>« Je le téléphone »</span> is wrong. téléphoner takes à → <span class=fr>Je lui téléphone.</span>"}],
  quiz:[
   {q:"Je vois Marie → Je ___ vois.", t:["la"], x:"Direct, feminine."},
   {q:"Je parle à Marie → Je ___ parle.", t:["lui"], x:"à + person → lui."},
   {q:"Je téléphone à mes parents → Je ___ téléphone.", t:["leur"], x:"Plural indirect → leur."},
   {q:"J'attends le bus → Je ___ attends.", t:["l'"], x:"attendre is direct."},
   {q:"« Tu as vu le film ? » « Oui, ___ »", o:["je l'ai vu","j'ai le vu","je lui ai vu"], a:0, x:"Before the auxiliary."}]},

 {id:"a2-pronominaux", title:"Les verbes pronominaux", en:"Reflexive verbs: se lever", yt:"French reflexive verbs daily routine",
  intro:"Reflexive verbs come with a pronoun that matches the subject. You need them to describe your daily routine.",
  blocks:[
   {t:"table", h:"se lever — to get up", head:["Pronoun","Form"], rows:[["je","me lève"],["tu","te lèves"],["il / elle","se lève"],["nous","nous levons"],["vous","vous levez"],["ils / elles","se lèvent"]]},
   {t:"rules", h:"Common ones", items:["<span class=fr>se réveiller, se laver, s'habiller, se coucher, se reposer, se promener, se dépêcher</span>","<span class=fr>s'appeler, s'occuper de, se souvenir de, s'intéresser à</span>"]},
   {t:"ex", items:[["Je ne me lève pas avant sept heures.","I don't get up before seven."],["Dépêche-toi ! / Ne te dépêche pas.","Hurry up! / Don't hurry."]]},
   {t:"trap", text:"In the passé composé they always take <b>être</b>: <span class=fr>Elle s'est réveillée tard.</span>"}],
  quiz:[
   {q:"Nous ___ couchons tard.", t:["nous"], x:"nous nous couchons."},
   {q:"Tu ___ appelles comment ?", t:["t'"], x:"te → t' before a vowel."},
   {q:"Imperative of « tu te dépêches »", o:["Dépêche-toi !","Te dépêche !","Dépêches-te !"], a:0, x:"toi after the verb."},
   {q:"Negate: « Je me réveille tôt. »", t:["je ne me réveille pas tôt","je ne me réveille pas tôt."], x:"ne + pronoun + verb + pas."}]},

 {id:"a2-comparaison", title:"Comparatifs et superlatifs", en:"more, less, the most", yt:"French comparatives superlatives meilleur mieux",
  intro:"Comparing is essential for the exam's opinion tasks: « La ville est plus chère que la campagne… »",
  blocks:[
   {t:"table", h:"Patterns", head:["Pattern","Example"], rows:[["plus … que","Elle est plus grande que lui."],["moins … que","C'est moins cher que l'avion."],["aussi … que","Il est aussi intelligent que sa sœur."],["plus de / moins de / autant de + noun","J'ai autant de travail que toi."],["le / la / les plus …","C'est la plus belle ville du pays."]]},
   {t:"table", h:"Irregulars", head:["Base","Comparative","Superlative"], rows:[["bon (good, adjective)","meilleur","le meilleur"],["bien (well, adverb)","mieux","le mieux"],["mauvais","pire / plus mauvais","le pire"]]},
   {t:"trap", text:"Never « plus bon ». <span class=fr>Ce restaurant est <mark>meilleur</mark>.</span> And for verbs: <span class=fr>Elle parle <mark>mieux</mark>.</span>"}],
  quiz:[
   {q:"Paris est ___ grand que Lyon.", t:["plus"], x:"plus … que."},
   {q:"Ce restaurant est ___ que l'autre.", o:["plus bon","meilleur","mieux"], a:1, x:"bon → meilleur."},
   {q:"Elle parle ___ maintenant.", o:["meilleur","mieux"], a:1, x:"Adverb → mieux."},
   {q:"« I have as much work as you »", o:["J'ai aussi travail que toi","J'ai autant de travail que toi"], a:1, x:"autant de + noun."}]},

 {id:"a2-irreguliers", title:"Verbes irréguliers essentiels", en:"aller, faire, venir, pouvoir…", yt:"French irregular verbs present aller faire pouvoir vouloir",
  intro:"These verbs appear in almost every sentence. Learn one per day with the flashcards and say them out loud.",
  blocks:[
   {t:"table", h:"Present tense", head:["","aller","faire","venir","pouvoir","vouloir","devoir"], rows:[["je","vais","fais","viens","peux","veux","dois"],["tu","vas","fais","viens","peux","veux","dois"],["il","va","fait","vient","peut","veut","doit"],["nous","allons","faisons","venons","pouvons","voulons","devons"],["vous","allez","faites","venez","pouvez","voulez","devez"],["ils","vont","font","viennent","peuvent","veulent","doivent"]]},
   {t:"rules", h:"Useful expressions", items:["<span class=fr>venir de + infinitive</span> = just did: <span class=fr>Je viens de manger.</span>","<span class=fr>faire les courses / la cuisine / du sport</span>","<span class=fr>Il fait beau / froid / chaud.</span>","<span class=fr>prendre le bus, prendre un café</span>"]},
   {t:"trap", text:"<span class=fr>vous faites</span> and <span class=fr>vous dites</span>, never « vous faisez »."}],
  quiz:[
   {q:"Nous ___ (faire) du sport.", t:["faisons"], x:"faisons."},
   {q:"Ils ___ (aller) au cinéma.", t:["vont"], x:"vont."},
   {q:"Je ___ (pouvoir) venir.", t:["peux"], x:"peux."},
   {q:"« I just ate »", o:["Je viens de manger","J'ai juste mangé","Je vais manger"], a:0, x:"venir de + infinitive."}]},

 {id:"a2-y-en", title:"Les pronoms Y et EN", en:"y (there) and en (some/of it)", yt:"pronoms y en French explained",
  intro:"<b>y</b> replaces à + a thing or place. <b>en</b> replaces de + something, including quantities.",
  blocks:[
   {t:"table", h:"How they work", head:["Pronoun","Replaces","Example"], rows:[["y","à / en / dans + place","Tu vas à la banque ? — Oui, j'y vais."],["y","à + thing","Je pense à mon examen. — J'y pense."],["en","du / de la / des + noun","Tu veux du café ? — Oui, j'en veux."],["en","a quantity","J'ai trois frères. — J'en ai trois."],["en","de + thing","Il parle de son travail. — Il en parle."]]},
   {t:"rules", h:"Remember", items:["<span class=fr>Il y en a</span> = there is some / there are some.","For people, use a stressed pronoun: <span class=fr>Je pense à ma mère → Je pense à elle.</span>"]},
   {t:"trap", text:"With a quantity, keep the number at the end: <span class=fr>J'en ai <mark>deux</mark>.</span>"}],
  quiz:[
   {q:"Tu vas à la banque ? Oui, j'___ vais.", t:["y"], x:"Place → y."},
   {q:"Tu veux du café ? Oui, j'___ veux.", t:["en"], x:"du café → en."},
   {q:"J'ai trois frères →", o:["J'en ai trois.","J'y ai trois.","J'ai en trois."], a:0, x:"Quantity → en … trois."},
   {q:"Je pense à mes vacances →", o:["J'en pense.","J'y pense."], a:1, x:"penser à + thing → y."}]},

 {id:"a2-temps", title:"Depuis, il y a, pendant, dans", en:"Time expressions", yt:"depuis il y a pendant French",
  intro:"Four little words that English speakers mix up all the time. The exam loves them.",
  blocks:[
   {t:"table", h:"Which one?", head:["Word","Meaning","Tense","Example"], rows:[["depuis","since / for (still true)","present","J'habite ici depuis trois ans."],["il y a","ago","past","Je suis arrivée il y a deux ans."],["pendant","during / for (finished)","any","J'ai étudié pendant une heure."],["dans","in (from now)","future","Je pars dans une semaine."]]},
   {t:"trap", text:"« I have lived here for 3 years » uses the <b>present</b> in French: <span class=fr>J'<mark>habite</mark> ici depuis trois ans.</span>"}],
  quiz:[
   {q:"J'apprends le français ___ un an. (still learning)", o:["depuis","il y a","pendant"], a:0, x:"Still true → depuis + present."},
   {q:"Je suis arrivée au Canada ___ cinq ans.", o:["depuis","il y a","dans"], a:1, x:"ago → il y a."},
   {q:"Mon examen est ___ six mois.", o:["dans","depuis","il y a"], a:0, x:"From now → dans."},
   {q:"Hier, j'ai travaillé ___ huit heures.", o:["pendant","depuis"], a:0, x:"Finished duration → pendant."}]}
],

b1:{ name:"B1", title:"Seuil", en:"Threshold", blurb:"Telling stories with the right past tenses, giving opinions with reasons, and the conditional and subjunctive. The exam's « independent user » level.",
grammar:[
 {id:"b1-pc-imp", title:"Passé composé ou imparfait ?", en:"Choosing the past tense", yt:"passé composé vs imparfait innerFrench",
  intro:"The most important choice in French storytelling. Think of a film: the <b>imparfait</b> is the scenery, the <b>passé composé</b> is the action.",
  blocks:[
   {t:"table", h:"The difference", head:["Imparfait (background)","Passé composé (events)"], rows:[["what was happening","what happened"],["description, weather, feelings","a single, completed action"],["habits: tous les jours, souvent","one time: hier, soudain, un jour"],["Il pleuvait…","…quand je suis sortie."]]},
   {t:"ex", items:[["Je regardais la télé quand le téléphone a sonné.","I was watching TV when the phone rang."],["Il y a quelques années, j'ai décidé de partir. C'était difficile.","A few years ago I decided to leave. It was hard."]]},
   {t:"rules", h:"The story formula (from your workbook)", items:["Setting in <b>imparfait</b>: <span class=fr>C'était l'hiver, il faisait froid…</span>","Events in <b>passé composé</b>: <span class=fr>Un jour, j'ai reçu un appel…</span>","Ending + feeling: <span class=fr>Finalement… Depuis ce jour…</span>"]},
   {t:"trap", text:"<span class=fr>soudain, tout à coup, un jour</span> almost always trigger the passé composé."}],
  quiz:[
   {q:"Il ___ (pleuvoir) quand je suis sortie.", o:["a plu","pleuvait"], a:1, x:"Background → imparfait."},
   {q:"Hier, j'___ (rencontrer) Paul au café.", o:["ai rencontré","rencontrais"], a:0, x:"One event → passé composé."},
   {q:"Quand j'étais enfant, je ___ (aller) à la plage chaque été.", o:["suis allé","allais"], a:1, x:"Habit → imparfait."},
   {q:"Soudain, la lumière ___ (s'éteindre).", o:["s'éteignait","s'est éteinte"], a:1, x:"soudain → passé composé."}]},

 {id:"b1-pqp", title:"Le plus-que-parfait", en:"The pluperfect (had done)", yt:"plus-que-parfait French",
  intro:"For an action that happened <b>before</b> another past action. Form: <b>imparfait of avoir / être + past participle</b>.",
  blocks:[
   {t:"table", h:"Form", head:["avoir verbs","être verbs"], rows:[["j'avais mangé","j'étais parti(e)"],["tu avais fini","tu étais venu(e)"],["nous avions vu","nous étions arrivé(e)s"]]},
   {t:"ex", items:[["Quand je suis arrivée, le film avait déjà commencé.","When I arrived, the film had already started."],["Il m'a dit qu'il avait trouvé un travail.","He told me he had found a job."]]},
   {t:"trap", text:"Same être / avoir choice and agreement rules as the passé composé."}],
  quiz:[
   {q:"Quand je suis arrivée, le film ___ (commencer).", t:["avait commencé","avait déjà commencé"], x:"avait commencé."},
   {q:"Elle ___ (partir) avant moi.", t:["était partie"], x:"partir takes être → était partie."},
   {q:"Il m'a dit qu'il ___ (finir) son travail.", o:["avait fini","a fini","finira"], a:0, x:"Earlier past → plus-que-parfait."}]},

 {id:"b1-conditionnel", title:"Le conditionnel présent", en:"Would: politeness & hypotheses", yt:"conditionnel présent si imparfait French",
  intro:"Form: <b>future stem + imparfait endings</b> (-ais, -ais, -ait, -ions, -iez, -aient). It's the polite, hypothetical voice, and it's everywhere in the TEF speaking tasks.",
  blocks:[
   {t:"table", h:"Uses", head:["Use","Example"], rows:[["Politeness","Je voudrais un renseignement. Pourriez-vous m'aider ?"],["Advice","Tu devrais dormir plus."],["Wishes","J'aimerais vivre à Montréal."],["Hypothesis","Si j'avais le temps, je voyagerais."]]},
   {t:"rules", h:"The si rule", items:["<b>Si + imparfait → conditionnel</b>: <span class=fr>Si j'étais riche, j'achèterais une maison.</span>","<b>Si + présent → futur</b>: <span class=fr>S'il fait beau, on ira à la plage.</span>"]},
   {t:"trap", text:"Never put the conditional right after <b>si</b>: <span class=fr><s>Si j'aurais</s> → Si j'avais</span>."}],
  quiz:[
   {q:"Si j'___ (avoir) de l'argent, j'achèterais une maison.", t:["avais"], x:"si + imparfait."},
   {q:"Polite « I would like »", o:["Je veux","Je voudrais","Je voulais"], a:1, x:"Conditional = polite."},
   {q:"Tu ___ (devoir) te reposer.", t:["devrais"], x:"Advice → devrais."},
   {q:"Nous ___ (aller) au Québec si nous avions des vacances.", t:["irions"], x:"ir- + ions."},
   {q:"Which is correct?", o:["Si j'aurais le temps, je viendrais.","Si j'avais le temps, je viendrais."], a:1, x:"No conditional after si."}]},

 {id:"b1-subj", title:"Le subjonctif présent", en:"The subjunctive", yt:"subjonctif présent French Français avec Pierre",
  intro:"The subjunctive expresses necessity, wishes, emotions and doubt. At B1 you need it after a short list of triggers, and the examiner will notice when you use it.",
  blocks:[
   {t:"rules", h:"How to form it", items:["Take <b>ils</b> in the present, remove -ent: <span class=fr>ils parl<s>ent</s>, ils finiss<s>ent</s></span>","Add <b>-e, -es, -e, -ions, -iez, -ent</b>: <span class=fr>que je parle, que tu finisses</span>"]},
   {t:"table", h:"Irregulars", head:["être","avoir","faire","aller","pouvoir","savoir"], rows:[["que je sois","que j'aie","que je fasse","que j'aille","que je puisse","que je sache"],["que nous soyons","que nous ayons","que nous fassions","que nous allions","que nous puissions","que nous sachions"]]},
   {t:"rules", h:"Triggers", items:["Necessity: <span class=fr>il faut que, il est important que</span>","Wish: <span class=fr>je veux que, je souhaite que</span>","Emotion: <span class=fr>je suis content(e) que, j'ai peur que</span>","Conjunctions: <span class=fr>bien que, pour que, avant que, à condition que</span>"]},
   {t:"trap", text:"Same subject → infinitive, not subjunctive: <span class=fr>Je veux partir</span>, but <span class=fr>Je veux que <mark>tu</mark> partes</span>."}],
  quiz:[
   {q:"Il faut que tu ___ (venir).", t:["viennes"], x:"ils viennent → que tu viennes."},
   {q:"Je veux que vous ___ (être) à l'heure.", t:["soyez"], x:"Irregular: soyez."},
   {q:"Il faut que nous ___ (faire) attention.", t:["fassions"], x:"fassions."},
   {q:"Fix: « Je veux que je parte. »", o:["Je veux partir.","Je veux que je pars."], a:0, x:"Same subject → infinitive."},
   {q:"« bien que » is followed by…", o:["l'indicatif","le subjonctif"], a:1, x:"bien que + subjonctif."}]},

 {id:"b1-relatifs", title:"Qui, que, dont, où", en:"Relative pronouns", yt:"pronoms relatifs qui que dont où",
  intro:"Relative pronouns let you join two sentences into one longer, more fluent sentence. That's exactly what moves you from A2 to B1.",
  blocks:[
   {t:"table", h:"Which one?", head:["Pronoun","Replaces","Example"], rows:[["qui","the subject","La femme <mark>qui</mark> parle est ma mère."],["que / qu'","the direct object","Le livre <mark>que</mark> je lis est intéressant."],["dont","de + noun","C'est le film <mark>dont</mark> je parlais."],["où","a place or a time","La ville <mark>où</mark> j'habite. Le jour <mark>où</mark> je suis arrivée."],["ce qui / ce que","« what »","<mark>Ce qui</mark> me plaît, c'est le calme."]]},
   {t:"rules", h:"dont goes with « de » verbs", items:["<span class=fr>parler de, avoir besoin de, se souvenir de, avoir peur de, être fier de</span>","<span class=fr>C'est l'outil <mark>dont</mark> j'ai besoin.</span>"]},
   {t:"trap", text:"<b>que</b> becomes qu' before a vowel. <b>qui</b> never does: <span class=fr>l'homme qui est là</span>."}],
  quiz:[
   {q:"Le livre ___ je lis.", o:["qui","que","dont"], a:1, x:"je is the subject → que for the object."},
   {q:"La femme ___ parle.", o:["qui","que","où"], a:0, x:"Subject → qui."},
   {q:"Le film ___ je parlais.", o:["que","dont","où"], a:1, x:"parler de → dont."},
   {q:"La ville ___ j'habite.", t:["où"], x:"Place → où."},
   {q:"___ me plaît, c'est le calme.", o:["Ce qui","Ce que","Qui"], a:0, x:"Subject « what » → ce qui."}]},

 {id:"b1-ordre", title:"L'ordre des pronoms", en:"Combining pronouns", yt:"French double object pronouns order",
  intro:"When two pronouns appear together, they follow a fixed order. Learn the order once, then drill it.",
  blocks:[
   {t:"table", h:"The order", head:["1","2","3","4","5"], rows:[["me, te, se, nous, vous","le, la, les","lui, leur","y","en"]]},
   {t:"ex", items:[["Je le lui donne.","I give it to him/her."],["Il m'en a parlé.","He talked to me about it."],["Il y en a beaucoup.","There are lots of them."]]},
   {t:"rules", h:"In the imperative", items:["Affirmative: after the verb, with hyphens. me → moi: <span class=fr>Donne-le-moi !</span>","Negative: normal order, before the verb: <span class=fr>Ne me le donne pas.</span>"]},
   {t:"trap", text:"<span class=fr><s>Je lui le donne</s></span> is wrong. le comes before lui."}],
  quiz:[
   {q:"Je donne le livre à Paul →", o:["Je lui le donne","Je le lui donne","Je le donne lui"], a:1, x:"le before lui."},
   {q:"Il me donne des conseils →", o:["Il m'en donne","Il en me donne"], a:0, x:"me before en."},
   {q:"Donne-moi le stylo →", t:["donne-le-moi","donne-le-moi !"], x:"Affirmative imperative: le-moi."},
   {q:"Il y a des pommes →", t:["il y en a"], x:"y before en."}]},

 {id:"b1-connecteurs", title:"Les connecteurs logiques", en:"Linking words", yt:"connecteurs logiques français B1",
  intro:"Connectors are the cheapest way to raise your score. They show the examiner you can build an argument.",
  blocks:[
   {t:"table", h:"By function", head:["Function","Connectors"], rows:[["Cause","parce que, car, puisque, grâce à (+), à cause de (−)"],["Consequence","donc, alors, c'est pourquoi, par conséquent"],["Opposition","mais, pourtant, cependant, par contre, en revanche"],["Addition","de plus, en plus, également, d'ailleurs"],["Order","d'abord, ensuite, puis, enfin, finalement"],["Example","par exemple, notamment, comme"]]},
   {t:"rules", h:"The 4-step answer (from your workbook)", items:["<b>Point</b>: <span class=fr>Je pense que…</span>","<b>Reason</b>: <span class=fr>parce que… / car…</span>","<b>Example</b>: <span class=fr>par exemple… / notamment…</span>","<b>Nuance</b>: <span class=fr>cependant… / mais…</span>"]},
   {t:"trap", text:"<b>grâce à</b> is for good results, <b>à cause de</b> for bad ones: <span class=fr>J'ai réussi grâce à toi. Je suis en retard à cause des travaux.</span>"}],
  quiz:[
   {q:"J'ai réussi ___ ton aide.", o:["grâce à","à cause de"], a:0, x:"Positive → grâce à."},
   {q:"Il pleut, ___ je reste à la maison.", o:["donc","pourtant","car"], a:0, x:"Consequence."},
   {q:"Il est riche, ___ il n'est pas heureux.", o:["donc","pourtant","parce que"], a:1, x:"Opposition."},
   {q:"Which shows an example?", o:["notamment","cependant","donc"], a:0, x:"notamment = in particular."}]},

 {id:"b1-imperatif", title:"L'impératif", en:"Giving instructions & advice", yt:"impératif français",
  intro:"Use the imperative to give orders, instructions or advice, for example when persuading someone in the TEF speaking section.",
  blocks:[
   {t:"table", h:"Form: tu, nous, vous, no subject", head:["Verb","tu","nous","vous"], rows:[["parler","parle","parlons","parlez"],["finir","finis","finissons","finissez"],["être","sois","soyons","soyez"],["avoir","aie","ayons","ayez"],["aller","va","allons","allez"]]},
   {t:"rules", h:"Remember", items:["-er verbs drop the s for tu: <span class=fr>Tu parles → Parle !</span> (but <span class=fr>Vas-y !</span>)","Softer advice: <span class=fr>N'hésitez pas à…, Pensez à…</span>"]},
   {t:"trap", text:"In the exam, a bare imperative can sound rude. Soften it: <span class=fr>Venez, s'il vous plaît</span>, or use <span class=fr>vous devriez…</span>"}],
  quiz:[
   {q:"Tu écoutes → ___ !", t:["écoute"], x:"No s for -er verbs."},
   {q:"Vous êtes patients → ___ patients !", t:["soyez"], x:"soyez."},
   {q:"Nous allons → ___ !", t:["allons"], x:"allons-y !"}]}
],
listening:{ channels:["inner","easy","authent","rfi","radiocan"],
 tips:[["Listen for the connector","After « mais », « cependant » or « par contre » comes the important idea. Questions often test exactly that."],["Know spoken shortcuts","« chuis » = je suis, « chais pas » = je ne sais pas, « y'a » = il y a, « j'vais » = je vais."],["Get used to Québec French","For the TEF Canada, listen to Radio-Canada too. « Là », « pis » (puis), « c'est le fun » are common."],["Predict before you listen","Read the question first and guess what kind of answer comes: a number? a reason? a place?"]],
 dictee:[["Si j'avais plus de temps, je ferais du bénévolat.","If I had more time, I would volunteer."],["Il faut que tu prennes une décision rapidement.","You need to make a decision quickly."],["C'est la ville où j'ai rencontré mon mari.","It's the city where I met my husband."],["Je regardais la télévision quand quelqu'un a frappé à la porte.","I was watching TV when someone knocked on the door."],["Bien qu'il soit fatigué, il continue à travailler.","Although he's tired, he keeps working."],["Je ne pense pas que ce soit une bonne idée.","I don't think it's a good idea."]]},
reading:[
 {title:"Le télétravail : une tendance qui dure", src:"Article · B1", text:["Depuis quelques années, de plus en plus de Canadiens choisissent de télétravailler, au moins partiellement. Cette tendance, accélérée par la pandémie, présente plusieurs avantages : moins de temps perdu dans les transports et plus de flexibilité dans l'organisation de la journée.","Cependant, certains employeurs s'inquiètent d'une possible baisse de la productivité, tandis que d'autres estiment au contraire que les employés en télétravail sont souvent plus efficaces."],
  gloss:[["partiellement","partly"],["s'inquiéter de","to worry about"],["tandis que","whereas"],["estimer","to consider, to believe"]],
  qs:[{q:"Qu'est-ce qui a accéléré cette tendance ?", o:["La technologie","La pandémie","Les employeurs"], a:1},{q:"Quel avantage est cité ?", o:["Un meilleur salaire","Moins de temps dans les transports","Plus de collègues"], a:1},{q:"Les employeurs sont-ils tous d'accord ?", o:["Oui, tous pensent que c'est positif","Non, leurs avis sont différents","Oui, tous sont contre"], a:1}]},
 {title:"Courrier des lecteurs", src:"Journal local · B1", text:["Madame, Monsieur,","J'habite le quartier depuis quinze ans et je suis inquiète. La mairie a décidé de transformer le parc municipal en stationnement. Pourtant, ce parc est le seul espace vert où les enfants peuvent jouer en sécurité.","Je comprends qu'il manque des places pour les voitures, mais il me semble qu'on pourrait plutôt améliorer les transports en commun. Je propose donc d'organiser une réunion publique avant toute décision définitive.","Hélène Roy"],
  gloss:[["la mairie","city hall"],["le stationnement","parking lot (Québec)"],["il manque","there is a lack of"]],
  qs:[{q:"Quel est le but de la lettre ?", o:["Remercier la mairie","Protester contre un projet","Vendre une maison"], a:1},{q:"Que propose Hélène ?", o:["Construire un parc","Organiser une réunion publique","Acheter une voiture"], a:1},{q:"« Pourtant » introduit…", o:["une conséquence","une opposition","un exemple"], a:1}]}
],
speaking:{
 tips:[["Don't translate, assemble","Pick a frame, drop in your topic words, add a connector. Faster and more accurate than translating from English."],["The 4-step answer","Point → reason → example → nuance. Use it for every opinion question."],["Buy time politely","« C'est une bonne question… », « Laissez-moi réfléchir… », « En fait… ». Better than silence."],["TEF Canada speaking, Section A","You call about an ad and must ask questions for information. Practise asking 10+ different, polite questions."]],
 frames:[["Donner son avis",["Je pense que… parce que…","À mon avis, …","Selon moi, …","Il me semble que…"]],["Être d'accord ou pas",["Je suis tout à fait d'accord parce que…","Je comprends ce point de vue, mais…","Je vois les choses différemment.","Pas du tout, au contraire…"]],["Demander des informations (Section A)",["Est-ce que vous pourriez m'expliquer… ?","J'aimerais savoir si…","Quels sont les horaires ?","Est-ce qu'il faut réserver à l'avance ?"]],["Décrire une image",["Sur cette image, on voit…","Au premier plan, il y a…","En arrière-plan, …","Cela me fait penser à…"]]],
 prompts:[{task:"Section A : Vous voyez une annonce pour un cours de cuisine. Vous appelez pour avoir des informations. Posez au moins 8 questions.", time:180, model:"Bonjour, je vous appelle au sujet de l'annonce pour le cours de cuisine. J'aimerais avoir quelques informations. Quand est-ce que les cours ont lieu ? Combien de temps dure chaque séance ? Quel est le prix total ? Est-ce que les ingrédients sont compris ? Combien de personnes y a-t-il par groupe ? Faut-il apporter quelque chose ? Est-ce qu'il y a un niveau minimum ? Comment est-ce que je peux m'inscrire ? Merci beaucoup pour ces renseignements."},{task:"Quels sont les avantages et les inconvénients du télétravail ?", time:120, model:"Le télétravail a des avantages, comme plus de flexibilité et moins de temps dans les transports. Par exemple, je gagne une heure par jour. Cependant, il y a aussi des inconvénients, notamment l'isolement. À mon avis, deux ou trois jours par semaine, c'est l'idéal."},{task:"Racontez une expérience qui a changé votre vie.", time:120, model:"Il y a quelques années, j'ai déménagé au Canada. Au début, c'était difficile parce que je ne connaissais personne. Mais petit à petit, je me suis adaptée. J'ai trouvé un travail et je me suis fait des amis. Cette expérience m'a rendue plus indépendante."}],
 ladder:[["A2","Je pense que les réseaux sociaux sont utiles."],["B1","Je pense que les réseaux sociaux sont utiles parce qu'ils permettent aux gens de communiquer facilement."],["B2","À mon avis, les réseaux sociaux présentent plusieurs avantages, notamment parce qu'ils permettent aux utilisateurs de rester en contact avec leurs proches, même lorsqu'ils vivent dans des pays différents."]]},
writing:{ tips:["Structure: introduction (your position) → one idea per paragraph (reason + example) → conclusion.","Formal letters: « Madame, Monsieur, » … « Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées. »","Use at least 3 different connectors and one subjunctive."],
 prompts:[{id:"b1w1", task:"TEF Section A style : Continuez cet article. « Une ville canadienne a décidé d'interdire les voitures dans son centre-ville le dimanche… »", min:80, max:120},{id:"b1w2", task:"Écrivez à votre propriétaire pour signaler un problème dans votre appartement et demander une réparation.", min:100, max:140}]}
},

b2:{ name:"B2", title:"Avancé", en:"Vantage", blurb:"Nuanced arguments, complex sentences and formal register. You can defend a point of view and persuade someone, as the TEF Canada asks.",
grammar:[
 {id:"b2-cond-passe", title:"Le conditionnel passé", en:"Would have: regrets & reproaches", yt:"conditionnel passé si plus-que-parfait",
  intro:"Form: <b>conditionnel of avoir / être + past participle</b>. Use it for what would have happened, for regrets, and for reproaches.",
  blocks:[
   {t:"table", h:"Uses", head:["Use","Example"], rows:[["Unreal past","Si j'avais su, je serais venue."],["Regret","J'aurais aimé étudier la médecine."],["Reproach","Tu aurais dû m'appeler !"],["Unconfirmed news","Selon la police, l'incendie aurait fait deux blessés."]]},
   {t:"rules", h:"The three si patterns", items:["si + présent → futur: <span class=fr>Si tu viens, on ira.</span>","si + imparfait → conditionnel: <span class=fr>Si tu venais, on irait.</span>","si + plus-que-parfait → conditionnel passé: <span class=fr>Si tu étais venu, on serait allés.</span>","Mixed: <span class=fr>Si j'avais étudié, je serais médecin aujourd'hui.</span>"]},
   {t:"trap", text:"In news, the conditional means « reportedly ». <span class=fr>Le ministre aurait démissionné</span> = the minister has reportedly resigned. Reading questions test this."}],
  quiz:[
   {q:"Si j'avais su, je ___ (venir).", t:["serais venu","serais venue"], x:"si + PQP → conditionnel passé."},
   {q:"« You should have called »", o:["Tu devrais appeler","Tu aurais dû appeler","Tu as dû appeler"], a:1, x:"Reproach → aurais dû."},
   {q:"« Le suspect aurait quitté le pays » means…", o:["He will leave","He has reportedly left","He should leave"], a:1, x:"Journalistic conditional."},
   {q:"Si tu avais dormi, tu ___ (être) moins fatigué maintenant.", t:["serais"], x:"Mixed: result now → conditionnel présent."}]},

 {id:"b2-subj-avance", title:"Subjonctif ou indicatif ?", en:"Advanced subjunctive", yt:"subjonctif ou indicatif penser que espérer que",
  intro:"At B2, the question isn't how to form the subjunctive. It's knowing when <b>not</b> to use it.",
  blocks:[
   {t:"table", h:"Tricky pairs", head:["Indicatif","Subjonctif"], rows:[["Je pense qu'il <b>a</b> raison.","Je ne pense pas qu'il <b>ait</b> raison."],["J'espère qu'il <b>viendra</b>.","Je souhaite qu'il <b>vienne</b>."],["Il est probable qu'il <b>pleuvra</b>.","Il est possible qu'il <b>pleuve</b>."],["après qu'il <b>est</b> parti","avant qu'il <b>parte</b>"],["même si + indicatif","bien que + subjonctif"]]},
   {t:"rules", h:"Also subjunctive", items:["After a superlative or « le seul »: <span class=fr>C'est le meilleur film que j'<mark>aie</mark> vu.</span>","Past subjunctive (que + aie / sois + participle): <span class=fr>Je suis contente que tu <mark>sois venu</mark>.</span>"]},
   {t:"trap", text:"<b>espérer que</b> takes the indicative, even though it expresses a wish. A very common B2 trap."}],
  quiz:[
   {q:"J'espère qu'il ___ (venir) demain.", o:["vienne","viendra"], a:1, x:"espérer + indicatif."},
   {q:"Je ne pense pas qu'il ___ (avoir) raison.", t:["ait"], x:"Negative opinion → subjonctif."},
   {q:"Il est possible qu'elle ___ (être) en retard.", t:["soit"], x:"Possibility → subjonctif."},
   {q:"Après qu'il ___ parti, nous avons mangé.", o:["soit","est"], a:1, x:"après que + indicatif."},
   {q:"Bien qu'il ___ (pleuvoir), nous sortons.", t:["pleuve"], x:"bien que + subjonctif."}]},

 {id:"b2-futur-ant", title:"Le futur antérieur", en:"Will have done", yt:"futur antérieur French",
  intro:"Form: <b>future of avoir / être + past participle</b>. For a future action finished before another future action.",
  blocks:[
   {t:"ex", items:[["Quand tu auras fini, on partira.","When you've finished, we'll leave."],["Dès que j'aurai reçu mes résultats, je t'appellerai.","As soon as I get my results, I'll call you."],["Il n'est pas là ? Il aura oublié.","He's not here? He must have forgotten."]]},
   {t:"rules", h:"Signal words", items:["<span class=fr>quand, lorsque, dès que, aussitôt que, une fois que, après que</span> + futur antérieur"]},
   {t:"trap", text:"English uses the present perfect (« when I've finished »). French uses the future perfect."}],
  quiz:[
   {q:"Quand tu ___ (finir), on partira.", t:["auras fini"], x:"auras fini."},
   {q:"Dès qu'elle ___ (arriver), on mangera.", t:["sera arrivée"], x:"arriver → être + agreement."},
   {q:"« Il aura oublié » can mean…", o:["He will forget","He must have forgotten","He forgot yesterday"], a:1, x:"A supposition about the past."}]},

 {id:"b2-lequel", title:"Lequel, auquel, duquel", en:"Relatives after prepositions", yt:"pronoms relatifs composés lequel auquel duquel",
  intro:"After a preposition, use a form of <b>lequel</b> (agreeing with the noun). It makes your writing sound properly B2.",
  blocks:[
   {t:"table", h:"Forms", head:["","Masc.","Fem.","Masc. pl.","Fem. pl."], rows:[["basic","lequel","laquelle","lesquels","lesquelles"],["à +","auquel","à laquelle","auxquels","auxquelles"],["de + (after a phrase)","duquel","de laquelle","desquels","desquelles"]]},
   {t:"ex", items:[["La raison pour laquelle je suis venue…","The reason why I came…"],["Le projet auquel je pense…","The project I'm thinking about…"],["Le parc près duquel j'habite…","The park near which I live…"]]},
   {t:"trap", text:"For people, <b>à qui / avec qui</b> is usually more natural: <span class=fr>la collègue avec qui je travaille</span>."}],
  quiz:[
   {q:"La raison pour ___ je pars.", o:["lequel","laquelle","qui"], a:1, x:"raison is feminine."},
   {q:"Le problème ___ je pense (penser à).", o:["auquel","duquel","lequel"], a:0, x:"à + lequel = auquel."},
   {q:"Les amis avec ___ je voyage.", o:["qui","lesquels","que"], a:0, x:"People → qui is more natural (lesquels also possible)."}]},

 {id:"b2-gerondif", title:"Participe présent et gérondif", en:"-ant forms", yt:"gérondif participe présent French",
  intro:"Form: <b>nous stem + -ant</b> (parlant, finissant). The gérondif adds <b>en</b> and shows two actions at the same time, a manner, or a condition.",
  blocks:[
   {t:"table", h:"Uses", head:["Form","Meaning","Example"], rows:[["en + -ant","at the same time","Je chante en cuisinant."],["en + -ant","how / by doing","C'est en pratiquant qu'on progresse."],["-ant (written)","= qui + verb","Les candidats ayant réussi recevront un courriel."],["ayant / étant + participle","after having","Ayant terminé, il est parti."]]},
   {t:"rules", h:"Irregulars", items:["<span class=fr>être → étant, avoir → ayant, savoir → sachant</span>"]},
   {t:"trap", text:"The subject of the gérondif must be the subject of the main verb. <span class=fr>En sortant, la pluie a commencé</span> wrongly says the rain went out."}],
  quiz:[
   {q:"C'est ___ (pratiquer) qu'on progresse.", t:["en pratiquant"], x:"en + pratiquant."},
   {q:"Present participle of « avoir »?", t:["ayant"], x:"ayant."},
   {q:"Je lis le journal ___ je prends mon café.", o:["en prenant","pendant que","prenant"], a:1, x:"Different structure: pendant que + verb. (Or: en prenant mon café.)"}]},

 {id:"b2-passif", title:"La voix passive", en:"The passive voice", yt:"voix passive français",
  intro:"Form: <b>être (any tense) + past participle</b>, agreeing with the subject. Very common in news articles and formal writing.",
  blocks:[
   {t:"ex", items:[["La loi a été votée par le parlement.","The law was passed by parliament."],["Les résultats seront publiés lundi.","The results will be published on Monday."],["Ce professeur est respecté de tous.","This teacher is respected by everyone."]]},
   {t:"rules", h:"Alternatives French prefers in speech", items:["<b>on</b>: <span class=fr>On a volé mon vélo.</span> (My bike was stolen.)","<b>se</b> + verb: <span class=fr>Le français se parle partout ici.</span>","<b>se faire</b> + infinitive: <span class=fr>Il s'est fait arrêter.</span>"]},
   {t:"trap", text:"de instead of par with feelings and states: <span class=fr>aimé de, respecté de, entouré de</span>."}],
  quiz:[
   {q:"Le parlement a voté la loi → La loi ___ par le parlement.", t:["a été votée"], x:"a été + votée (agreement)."},
   {q:"Natural speech for « My phone was stolen »", o:["Mon téléphone a été volé par quelqu'un.","On a volé mon téléphone."], a:1, x:"on is more natural."},
   {q:"Les décisions ___ (prendre) demain. (futur passif)", t:["seront prises"], x:"seront prises."}]},

 {id:"b2-discours", title:"Le discours indirect", en:"Reported speech", yt:"discours indirect concordance des temps",
  intro:"Reporting what someone said. When the intro verb is in the past, the tenses shift back.",
  blocks:[
   {t:"table", h:"Tense shifts", head:["Direct","Indirect (after « il a dit que »)"], rows:[["présent: « Je suis fatigué. »","imparfait: qu'il était fatigué"],["passé composé: « J'ai fini. »","plus-que-parfait: qu'il avait fini"],["futur: « Je viendrai. »","conditionnel: qu'il viendrait"],["impératif: « Viens ! »","de + infinitif: de venir"]]},
   {t:"table", h:"Questions and time words", head:["Direct","Indirect"], rows:[["Est-ce que… ?","si…"],["Qu'est-ce que… ?","ce que…"],["Qu'est-ce qui… ?","ce qui…"],["demain / hier","le lendemain / la veille"],["aujourd'hui","ce jour-là"]]},
   {t:"trap", text:"No inversion and no question mark in indirect questions: <span class=fr>Il m'a demandé <mark>où j'habitais</mark>.</span>"}],
  quiz:[
   {q:"« Je suis fatigué. » → Il a dit qu'il ___ fatigué.", t:["était"], x:"présent → imparfait."},
   {q:"« Je viendrai. » → Elle a dit qu'elle ___", t:["viendrait"], x:"futur → conditionnel."},
   {q:"« Est-ce que tu viens ? » → Il m'a demandé ___ je venais.", t:["si"], x:"est-ce que → si."},
   {q:"« Viens ! » → Il m'a dit ___", o:["de venir","que viens","venir"], a:0, x:"Imperative → de + infinitive."},
   {q:"« demain » in reported past speech:", o:["le lendemain","la veille","demain"], a:0, x:"le lendemain."}]},

 {id:"b2-nuance", title:"Nuancer et argumenter", en:"Concession & register", yt:"connecteurs argumentation B2 français",
  intro:"B2 is about nuance: admitting the other side, then defending your view. This is what the TEF « convaincre » task and the opinion essay reward.",

async function aiFeedback({key, kind, task, text, level}){
  const out = document.getElementById("fb-"+key); if (!out) return null;

  const ctl = new AbortController();

  out.querySelector("button").onclick = () => ctl.abort();
  const spoken = kind==="speak" ? "This is a transcript of SPOKEN French made with phone or PC dictation: ignore punctuation, capitals and obvious dictation homophone slips, and judge it as speech (fluency, structure, vocabulary, grammar)." : "This is WRITTEN French: judge it as writing (structure, coherence, vocabulary, grammar, spelling, accents).";
  const prompt = `You are an experienced TEF Canada / TCF Canada examiner and a warm, encouraging French tutor. The learner is an English speaker preparing for the exam, currently working at level ${level||"B1"}, aiming for B2.
${spoken}
Task given to the learner: ${task}
Learner's answer:
"""
${text.slice(0,6000)}
"""
Reply with only one JSON object, no other text:
{"level":"A1|A2|B1|B2|C1 (your estimate of this answer)","score":0-20 (TEF-style score for this task),"summary":"2 short sentences in English: overall impression","strengths":["up to 3 short points in English"],"corrections":[{"original":"exact words from the answer","correction":"corrected French","why":"very short English reason"}],"upgrade":"a rewritten version of their answer one level higher, in French, keeping their ideas (max 120 words)","next":"one concrete thing to practise next, in English"}
Give at most 8 corrections, most important first. If the answer is off-topic, say so in the summary.`;
  try{

    if (!r || typeof r !== "object") throw {code:"invalid_json"};
    r.date = TODAY; S.feedback[key] = r; save(); markActive();

}

function qHTML(q,key){
  if (q.o) return `<div class="q" data-q="${key}"><p>${q.q}</p><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o)}</button>`).join("")}</div><div class="fbwrap"></div></div>`;

/* Each attempt: up to 2 questions missed last time, then a random mix from the bank and fresh generated ones; options shuffled. */
const QUIZ_N = 6; const attempts = {};
const shuffled = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=rnd(i+1); [b[i],b[j]]=[b[j],b[i]]; } return b; };
function mixOpts(q){ if(!q.o) return q; const perm = shuffled([...q.o.keys()]); return {...q, o:perm.map(j=>q.o[j]), a:perm.indexOf(q.a)}; }
function attemptFor(L){
  if (attempts[L.id]) return attempts[L.id];
  const bank = [...L.quiz, ...(EXTRA[L.id]||[])], g = GEN[L.id];
  const missed = shuffled(S.missed[L.id]||[]).slice(0,2);
  const seen = new Set(missed.map(q=>q.q)); const qs = [...missed];
  const fromBank = shuffled(bank.filter(q=>!seen.has(q.q))).slice(0, Math.max(0, QUIZ_N - qs.length - (g?3:0)));
  fromBank.forEach(q=>{ qs.push(q); seen.add(q.q); });
  for (let tries=0; g && qs.length<QUIZ_N && tries<40; tries++){ const q=g(); if(!seen.has(q.q)){ qs.push(q); seen.add(q.q); } }
  attempts[L.id] = shuffled(qs).map(mixOpts); return attempts[L.id];
}
function findQ(key){ const i = key.lastIndexOf("-"); const lid = key.slice(0,i); const n=+key.slice(i+1); return {q:(attempts[lid]||[])[n], lid}; }
function answerQ(qEl, ok, msg, cls){
  qEl.dataset.answered = ok ? "1" : "0";
  const {q, lid:qlid} = findQ(qEl.dataset.q);
  if (q){ const m = (S.missed[qlid]||[]).filter(x=>x.q!==q.q); if(!ok) m.push({q:q.q, o:q.o, a:q.a, t:q.t, x:q.x}); S.missed[qlid] = m.slice(-6); }
  qEl.querySelector(".fbwrap").innerHTML = `<div class="fb ${cls||(ok?"ok":"no")}">${msg}</div>`;
  const quiz = qEl.closest("[data-quiz]"); const all=[...quiz.querySelectorAll(".q")]; const answered = all.filter(x=>x.dataset.answered!=null);
  if (answered.length===all.length){
    const right = all.filter(x=>x.dataset.answered==="1").length; const lid=quiz.dataset.quiz;
    const pctNow = Math.round(100*right/all.length); S.quizPct[lid] = Math.max(S.quizPct[lid]||0, pctNow);
    const pass = right/all.length >= .7;
    if (pass && !S.done[lid]) { S.done[lid]=true; }
    markActive(); save();
    quiz.querySelector("[data-score]").innerHTML = `<b style="font-size:1.3rem;font-family:var(--font-display)">${right}/${all.length}</b><span>${pass?"Très bien !"+(S.done[lid]?" Lesson marked as learned.":""):"Read the lesson again, then try a new set."}</span><button class="btn small primary" data-retry="${lid}">↻ New questions</button>`;
    if (pass) setTimeout(()=>{ const lst=document.querySelector(`[data-lesson="${lid}"] .tick`); if(lst){lst.classList.add("on"); lst.innerHTML=CHECK;} renderStreak(); },50);

function grade(g){
  const c=curCard; const st=S.cards[c.id]||{box:0}; let box=st.box;
  if (!S.cards[c.id]){ newLeft(deck); S.newToday.n[deck]=(S.newToday.n[deck]||0)+1; }
  if (g===0){ box=1; queue.splice(Math.min(3,queue.length),0,c); }
  else if (g===1){ box=Math.max(1,box); }
  else box=Math.min(box+1,6);

const examAvg = e => { const v=["co","ce","ee","eo"].map(k=>e[k]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; };
function historyChart(list){
  const W=640,H=230,L=44,R=16,T=14,B=30; const n=list.length; const x=i=> n===1 ? L+(W-L-R)/2 : L+i*(W-L-R)/(n-1); const y=v=>T+(100-v)*(H-T-B)/100;
  const keys=[["co","Listening","--a1"],["ce","Reading","--a2"],["ee","Writing","--b1"],["eo","Speaking","--b2"]];
  const bands=[[25,"A2"],[45,"B1"],[65,"B2"],[85,"C1"]];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mock exam scores over time" style="width:100%;height:auto;display:block">`;
  bands.forEach(([v,l])=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-dasharray="3 4"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">${l}</text>`; });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule-strong)"/>`;
  list.forEach((e,i)=>{ s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">${esc(e.date.slice(5))}</text>`; });
  keys.forEach(([k,,c])=>{ const pts=list.map((e,i)=>e[k]!=null?[x(i),y(e[k])]:null).filter(Boolean); if(pts.length>1) s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(${c})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`; pts.forEach((p,j)=>{ s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${j===pts.length-1?5:3.5}" fill="var(${c})" stroke="var(--surface)" stroke-width="1.5"/>`; }); });
  s+=`</svg>`;
  return `<div class="panel"><div class="legend">${keys.map(([,l,c])=>`<span><i style="background:var(${c})"></i>${l}</span>`).join("")}<span class="muted">dashed lines: rough level thresholds</span></div><div style="overflow-x:auto">${s}</div></div>`;
}

/* ============================== PROGRAMME ============================== */
let planAll = false;
function weekStart(d){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); x.setHours(12,0,0,0); return x; }
function computePlan(){
  const now = new Date(); const assumed = !S.examDate;
  const target = S.examDate ? new Date(S.examDate+"T12:00:00") : new Date(now.getTime()+280*86400000);
  const w0 = weekStart(now); const weeks = Math.max(1, Math.ceil((target - w0)/(7*86400000)));
  const order = ["a1","a2","b1","b2"]; const from = order.indexOf(S.current||"a1");
  const lessons = order.slice(from).flatMap(lv=>LEVELS[lv].grammar.map(g=>({...g, lv}))).filter(g=>!S.done[g.id]);
  const finalWeeks = weeks>=4 ? 2 : weeks>=2 ? 1 : 0; const learn = Math.max(1, weeks-finalWeeks);
  const per = Math.ceil(lessons.length/learn);
  const out = [];
  for (let w=0; w<weeks; w++){
    const start = new Date(w0.getTime()+w*7*86400000); const end = new Date(start.getTime()+6*86400000);
    const wk = {n:w+1, start, end, key:iso(start), items:[]};
    if (w < learn){
      const ls = lessons.slice(w*per, (w+1)*per); const lv = ls[0] ? ls[0].lv : (S.current||"a1");
      ls.forEach(g=>wk.items.push({t:"lesson", g}));
      if (!ls.length) wk.items.push({t:"text", txt:"Review: redo the quizzes you scored lowest on."});
      const th = THEMES[w % THEMES.length]; wk.items.push({t:"deck", id:th.id, txt:`Vocabulary: ${th.name}`});
      const L = LEVELS[lv]; const ch = CHANNELS[L.listening.channels[w % L.listening.channels.length]];
      wk.items.push({t:"listen", lv, txt:`Listening: 3 dictées (${L.name}) + 20 min of ${ch.name}`});
      const pr = L.speaking.prompts[w % L.speaking.prompts.length]; wk.items.push({t:"speak", lv, txt:`Speaking: « ${pr.task} »`});
      if (w%2===1){ const wp = L.writing.prompts[(w>>1) % L.writing.prompts.length]; wk.items.push({t:"write", lv, txt:`Writing: « ${wp.task} »`}); }
      if (w===0) wk.items.push({t:"exam", txt:"Take the diagnostic test to see where you start"});
      else if (w%4===3) wk.items.push({t:"exam", txt:`Checkpoint: ${MOCKS[((w+1)/4-1)%2].title}`});
      if (learn>6 && w===Math.floor(learn/2)) wk.items.push({t:"exam", txt:"Retake the diagnostic test and compare"});
    } else if (w === weeks-1 && finalWeeks){
      wk.final = true;
      ["Light review only: flashcards and the lessons' « Watch out » boxes","No new grammar: re-read your Notes","Day before: rest, a little listening, sleep well","Exam day: read every question first, answer in full sentences"].forEach(txt=>wk.items.push({t:"text", txt}));
    } else {
      wk.mock = true;
      wk.items.push({t:"exam", txt:"Both mock exams under timed conditions"});
      wk.items.push({t:"exam", txt:"Diagnostic test: review every section you miss"});
      wk.items.push({t:"text", txt:"Speaking intensive: every prompt at A2, then B1, then B2 level"});
    }
    out.push(wk);
  }
  return {weeks:out, assumed, target, per, perWeek:S.perWeek||5, lessons:lessons.length};
}
const fmtD = d => d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
